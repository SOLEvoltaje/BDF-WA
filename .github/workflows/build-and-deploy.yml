name: Build and Deploy Map

on:
  push:
    branches:
      - master
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        # ESTE ES EL PASO MÁGICO:
        # Convierte tus .ts a .js y optimiza el .tmj, guardando todo en la carpeta 'dist'
        run: npm run build

      - name: Deploy to GitHub Pages
        # Esta acción toma la carpeta 'dist' (lo compilado) y la sube a la rama 'gh-pages'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
